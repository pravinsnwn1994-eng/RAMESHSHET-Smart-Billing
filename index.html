
<section class="card" id="firebasePanel">
  <h2>Firebase Owner Login</h2>
  <input id="loginEmail" type="email"
         placeholder="Firebase Email">
  <input id="loginPassword" type="password"
         placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" class="secondary">
    Logout
  </button>
  <p id="syncStatus">Firebase connecting...</p>
  <button id="uploadCloud">
    Upload Backup to Cloud
  </button>
  <button id="restoreCloud" class="secondary">
    Restore Cloud Backup
  </button>
</section>
